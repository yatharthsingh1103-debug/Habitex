<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Properties Portfolio — Habitex</title>
  <meta name="description" content="Manage your active and published real estate holdings on Habitex.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Reusable Shared Navbar Mount -->
  <header id="navbar-mount"></header>

  <main id="main-content" class="site-main dashboard-page-wrap">
    <div class="container">
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: var(--space-8);">
        <div>
          <nav class="catalog-breadcrumbs" aria-label="Breadcrumb">
            <a href="home.html">Home</a>
            <span>/</span>
            <a href="dashboard.html">Dashboard</a>
            <span>/</span>
            <span style="color: var(--color-text);">My Listings</span>
          </nav>
          <h1 style="font-family: var(--font-serif); font-size: 2.25rem;">My Published Holdings</h1>
          <p style="color: var(--color-text-secondary); font-size: 0.9375rem;">
            Review marketplace status, manage inquiries, or update property descriptions.
          </p>
        </div>

        <a href="add-property.html" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Publish New Holding</span>
        </a>
      </div>

      <!-- Listings Table -->
      <div class="dashboard-table-card">
        <div class="table-responsive">
          <table class="property-admin-table">
            <thead>
              <tr>
                <th>Property Details</th>
                <th>Type</th>
                <th>Price</th>
                <th>Typology</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="my-listings-tbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Reusable Shared Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.DashboardController) {
        window.DashboardController.renderMyListingsTable();
      }
    });
  </script>
</body>
</html>
