<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B275" />
      <stop offset="100%" stop-color="#B88142" />
    </linearGradient>
    <linearGradient id="fullTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A433F" />
      <stop offset="100%" stop-color="#122E2B" />
    </linearGradient>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="72" height="72" rx="16" fill="url(#fullTealGrad)" />
    <rect x="1" y="1" width="70" height="70" rx="15" fill="none" stroke="#5F8178" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Roof Canopy -->
    <path d="M 18 29 L 36 14 L 54 29" fill="none" stroke="url(#fullGoldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Discovery Compass Star -->
    <path d="M 36 20 L 38 24.5 L 42.5 25.5 L 38 26.5 L 36 31 L 34 26.5 L 29.5 25.5 L 34 24.5 Z" fill="#D19A5A" />

    <!-- Monogram H -->
    <rect x="21" y="32" width="6" height="26" rx="3" fill="#F8FAF8" />
    <rect x="45" y="32" width="6" height="26" rx="3" fill="#F8FAF8" />
    <rect x="21" y="42" width="30" height="5" rx="2.5" fill="#F8FAF8" />

    <!-- Welcoming Portal -->
    <path d="M 31 58 L 31 51 C 31 47.5 41 47.5 41 51 L 41 58 Z" fill="url(#fullGoldGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(92, 0)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="2.5" fill="#163A36">HABITEX</text>
    <text x="1" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" text-transform="uppercase" fill="#D19A5A">discover where you belong</text>
  </g>
</svg>
