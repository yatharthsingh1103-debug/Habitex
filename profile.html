<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings & Preferences — Habitex</title>
  <meta name="description" content="Manage your Habitex account profile, verification credentials, and notification settings.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Reusable Shared Navbar Mount -->
  <header id="navbar-mount"></header>

  <main id="main-content" class="site-main form-page-layout">
    <div class="container container-form">
      <div class="form-page-header">
        <h1 class="form-page-title">Profile Settings & Credentials</h1>
        <p class="form-page-subtitle">
          Manage your verified member identity, communication preferences, and security credentials.
        </p>
      </div>

      <div class="form-wizard-card">
        <form id="profile-settings-form">
          <div class="section-pane-header">
            <h2 class="section-pane-title">Personal & Professional Identity</h2>
            <p class="section-pane-desc">This information is displayed on your published listings and enquiry responses.</p>
          </div>

          <div class="form-grid-2">
            <div class="form-field">
              <label for="prof-name" class="form-label">Full Name</label>
              <input type="text" id="prof-name" class="form-input" value="Yatharth" required>
            </div>

            <div class="form-field">
              <label for="prof-email" class="form-label">Email Address</label>
              <input type="email" id="prof-email" class="form-input" value="yatharth@habitex.in" required>
            </div>
          </div>

          <div class="form-grid-2" style="margin-top: var(--space-4);">
            <div class="form-field">
              <label for="prof-phone" class="form-label">Contact Mobile</label>
              <input type="tel" id="prof-phone" class="form-input" value="9810123456" required>
            </div>

            <div class="form-field">
              <label for="prof-role" class="form-label">Account Category</label>
              <select id="prof-role" class="form-select">
                <option value="Seller">Property Owner / Seller</option>
                <option value="Buyer">Buyer / Private Investor</option>
                <option value="Agent">Certified RERA Advisor</option>
              </select>
            </div>
          </div>

          <div class="form-field" style="margin-top: var(--space-4);">
            <label for="prof-company" class="form-label">Affiliated Firm / Family Office</label>
            <input type="text" id="prof-company" class="form-input" value="Yatharth Capital Real Estate LLP">
          </div>

          <!-- Notification Toggles -->
          <div style="margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid var(--color-border-subtle);">
            <h3 style="font-size: 1.05rem; margin-bottom: var(--space-3); color: var(--color-text);">Advisory Communication Preferences</h3>
            <div style="display: flex; flex-direction: column; gap: var(--space-3);">
              <label class="custom-checkbox-label">
                <input type="checkbox" checked>
                <span>Receive instant SMS & WhatsApp notifications when a buyer registers an enquiry</span>
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" checked>
                <span>Subscribe to the fortnightly Habitex Prime Market Intelligence briefing</span>
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" checked>
                <span>Notify me when comparable properties in my neighborhood are listed</span>
              </label>
            </div>
          </div>

          <!-- Buttons -->
          <div style="margin-top: var(--space-8); display: flex; justify-content: space-between; align-items: center;">
            <button type="button" class="btn btn-outline btn-sm" onclick="window.AuthManager.logout()" style="color:var(--color-error); border-color:var(--color-error);">Sign Out</button>
            <button type="submit" class="btn btn-primary">Save Profile Preferences</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Reusable Shared Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = window.AuthManager ? window.AuthManager.getUser() : null;
      if (user) {
        document.getElementById("prof-name").value = user.name || "";
        document.getElementById("prof-email").value = user.email || "";
        document.getElementById("prof-phone").value = user.phone || "";
        if (user.role) {
          document.getElementById("prof-role").value = user.role;
        }
      }

      document.getElementById("profile-settings-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const updated = {
          name: document.getElementById("prof-name").value.trim(),
          email: document.getElementById("prof-email").value.trim(),
          phone: document.getElementById("prof-phone").value.trim(),
          role: document.getElementById("prof-role").value,
          company: document.getElementById("prof-company").value.trim()
        };

        localStorage.setItem("estatecraft_current_user", JSON.stringify(updated));
        window.dispatchEvent(new CustomEvent("estatecraft-auth-changed", { detail: { user: updated } }));
        window.showToast("Profile settings saved successfully.", "success");
      });
    });
  </script>
</body>
</html>
